name: Refresh Lottery Data And Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "20 15 * * 6"
    - cron: "20 1 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-pages
  cancel-in-progress: false

jobs:
  refresh-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh official data
        run: python3 scripts/refresh_official_data.py

      - name: Build GitHub Pages bundle
        run: python3 scripts/build_github_pages.py

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs flutter_app/assets/data README.md scripts web .github/workflows/refresh-pages.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh lottery data and Pages bundle"
          git push
